name: Deploy Obsidian vault to GitHub Pages with Quartz

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the vault repo (this repo) into ./vault
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault

      # 2. Checkout Quartz itself into ./quartz (pulled fresh every run,
      #    so nothing from Quartz needs to live in your vault repo)
      #    Using v5: v4 has no Canvas support at all, Canvas rendering
      #    only exists as a v5 community plugin.
      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      # 3. Add the Canvas page-type plugin so .canvas files render
      #    as interactive pages instead of being skipped
      - name: Add canvas-page plugin
        working-directory: quartz
        run: npx quartz plugin add github:quartz-community/canvas-page

      # 4. Work out the Pages URL so Quartz's baseUrl / asset links resolve correctly
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # 5. Patch the Quartz config: correct baseUrl, site title, and
      #    ignore every file/folder whose name starts with "_".
      - name: Patch quartz.config.yaml
        working-directory: quartz
        env:
          RAW_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cat > patch-config.mjs <<'EOF'
          import fs from "node:fs"
          import YAML from "yaml"

          const OUT = "quartz.config.yaml"
          const src = fs.existsSync(OUT) ? OUT : "quartz.config.default.yaml"
          const doc = YAML.parse(fs.readFileSync(src, "utf8"))
          const cfg = (doc.configuration ??= {})

          cfg.baseUrl = process.env.RAW_BASE_URL.replace(/^https?:\/\//, "").replace(/\/$/, "")
          cfg.pageTitle = "Softeng"

          // "**/_*" catches underscore-prefixed files/folders at any depth,
          // "**/_*/**" catches everything inside an underscore-prefixed folder.
          cfg.ignorePatterns = [...new Set([...(cfg.ignorePatterns ?? []), "**/_*", "**/_*/**"])]

          const header = "# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json\n"
          fs.writeFileSync(OUT, header + YAML.stringify(doc, { lineWidth: 120 }))
          console.log(`baseUrl=${cfg.baseUrl} pageTitle=${cfg.pageTitle} ignorePatterns=${JSON.stringify(cfg.ignorePatterns)}`)
          EOF
          node patch-config.mjs

      # 6. Copy the vault content into Quartz's content/ folder.
      #    .obsidian is excluded (local app config, not needed on the site).
      #    "_*" is excluded so underscore-prefixed content (including images
      #    and other assets) never even reaches the published artifact.
      - name: Copy vault into Quartz content folder
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content
          rsync -av \
            --exclude='.obsidian' \
            --exclude='.git' \
            --exclude='_*' \
            vault/GI/ quartz/content/

      - name: Build Quartz site
        working-directory: quartz
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
