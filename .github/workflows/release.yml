name: Publish Obsidian Vault

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Debug vault contents
        run: |
          echo "=== GI directory ==="
          find ./GI -maxdepth 3 -type f | sort
          echo "=== markdown count ==="
          find ./GI -name "*.md" | wc -l

      - name: Download Kiln
        run: |
          curl -L \
            -o kiln \
            https://github.com/otaleghani/kiln/releases/latest/download/kiln_linux_amd64
          chmod +x kiln

      - name: Generate site
        run: |
          mkdir -p ./out
          ./kiln generate \
            --input ./GI \
            --output ./out \
            --url https://altinum.github.io/softeng

          echo "=== OUTPUT DIRECTORY ==="
          ls -la ./out || true

          echo "=== ALL GENERATED FILES ==="
          find ./out -type f -print 2>/dev/null | sort || true            
         
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
